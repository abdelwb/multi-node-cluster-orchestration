# gres.conf - Generic Resource (GPU) definitions.
#
# This local demo has no GPUs, so this file is intentionally empty of
# active entries (each node's slurm.conf line already declares Gres=gpu:0).
#
# On a real NVIDIA GPU-equipped cluster, uncomment and adjust these lines to
# match each node's actual devices, and change the corresponding node's
# Gres=gpu:N count in slurm.conf to match:
#
# NodeName=compute1 Name=gpu File=/dev/nvidia0
# NodeName=compute2 Name=gpu File=/dev/nvidia0
#
# For nodes with multiple GPUs, add one line per device, e.g. a DGX-class
# node with 8 GPUs:
#
# NodeName=compute1 Name=gpu File=/dev/nvidia[0-7]
#
# Jobs then request GPUs the same way regardless of node type:
#   sbatch --gres=gpu:2 my_job.sbatch
