# slurm.conf - minimal multi-node cluster configuration for local simulation.
#
# Cluster topology: 1 controller (slurmctld) + 2 compute nodes (slurmd),
# addressed by their Docker Compose service names (Compose's built-in DNS
# resolves these within the "slurm" network).

ClusterName=demo-cluster
SlurmctldHost=slurmctld

# --- Daemons / paths ---
SlurmUser=slurm
SlurmctldPidFile=/var/run/slurmctld.pid
SlurmdPidFile=/var/run/slurmd.pid
SlurmdSpoolDir=/var/spool/slurmd
StateSaveLocation=/var/spool/slurmctld
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log

# --- Scheduling ---
MpiDefault=none
ProctrackType=proctrack/linuxproc
ReturnToService=1
SwitchType=switch/none
TaskPlugin=task/none
SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_Core

# --- GRES (Generic Resources) ---
# GPUs are declared here so the scheduler understands GPU-aware requests
# (`--gres=gpu:N`). This local demo runs CPU-only, so each node advertises
# gpu:0. On a real GPU-equipped cluster, bump this to the node's actual GPU
# count and populate gres.conf accordingly - see gres.conf for the exact
# lines to uncomment.
GresTypes=gpu

# --- Accounting (disabled for this lightweight demo) ---
AccountingStorageType=accounting_storage/none
JobCompType=jobcomp/none

# --- Logging ---
SlurmctldDebug=info
SlurmdDebug=info

# --- Nodes ---
NodeName=compute1 NodeAddr=compute1 CPUs=1 Gres=gpu:0 State=UNKNOWN
NodeName=compute2 NodeAddr=compute2 CPUs=1 Gres=gpu:0 State=UNKNOWN

# --- Partitions ---
PartitionName=demo Nodes=compute1,compute2 Default=YES MaxTime=INFINITE State=UP
