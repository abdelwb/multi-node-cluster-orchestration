# cgroup.conf - resource containment configuration.
#
# TaskPlugin=task/none in slurm.conf means this file isn't consulted for
# this local demo (no cgroup-based enforcement inside nested containers,
# which keeps the local simulation simple and portable across hosts).
#
# On a real cluster, switch slurm.conf to TaskPlugin=task/cgroup and enable
# device constraints so GPU GRES allocations are actually enforced (a job
# that didn't request a GPU cannot see one):
#
# ConstrainCores=yes
# ConstrainRAMSpace=yes
# ConstrainDevices=yes
#
# Note: there is no valid "disabled" value for CgroupPlugin in this Slurm
# version - setting one breaks slurmd ("cannot find cgroup plugin for
# disabled"). Leaving this file with no CgroupPlugin line lets slurmd
# autodetect the container's cgroup filesystem instead.
